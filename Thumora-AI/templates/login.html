<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CLICKORA AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <a href="/" class="brand">
            <span>CLICKORA</span> AI
        </a>

        <br><br>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue optimizing your content.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit">

                Login

            </button>

        </form>


        <div class="auth-bottom">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();


        const password =
            document.getElementById("password")
                .value;


        try {

            const response = await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })
                }
            );


            const data =
                await response.json();


            if (data.success) {

                window.location.href =
                    "/dashboard";

            } else {

                alert(data.message);

            }

        } catch (error) {

            console.error(error);

            alert(
                "Unable to connect to server."
            );

        }

    });

</script>

</body>

</html>
